name: 'northwind'
version: '1.0.0'

profile: 'northwind'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Arquitetura medalhão:
#   bronze -> tabelas raw_ carregadas pelo Apache Hop (declaradas como sources)
#   silver -> modelos stg_ (views): limpeza, tipagem e nomes de negócio
#   gold   -> modelos dm_/ft_ (tabelas): esquema dimensional de vendas
models:
  northwind:
    silver:
      +materialized: view
    gold:
      +materialized: table
